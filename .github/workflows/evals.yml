name: tests-and-eval-gate

on:
  workflow_dispatch:   # "Run workflow" button, e.g. after adding the ANTHROPIC_API_KEY secret
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,anthropic]"
      - name: Safety tests
        run: pytest -q
      - name: Offline baseline eval gate
        run: python evals/run_evals.py --extractor baseline
      - name: LLM eval gate (runs only when the API key secret is configured)
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        continue-on-error: true   # real-model results are reported, not used as the build signal
        run: python evals/run_evals.py --extractor llm --provider anthropic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: evals/reports/
